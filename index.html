:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: a roster sheet. A year strip of 17 three-week blocks is the spine of every view. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#0f1f3d; --muted:#5a6680; --line:#d3dbe8; --line-soft:#e8edf5;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe6e9;
  --navy:#0b2a5b; --navy-ink:#ffffff;
  --peak:#fff4c2; --peak-ink:#6b5600; --leave:#dde7f7; --leave-ink:#0b2a5b;
  --ok:#1f7a4d; --ok-soft:#e0f2e8; --warn:#9a5b00; --warn-soft:#fdf0d9; --off:#8691a6; --off-soft:#f1f3f7;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{display:block}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.actas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.actas label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=date]{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--muted);text-decoration:none;padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--f-body);font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 7px}
main{padding-block:20px 48px}
.view{display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance;line-height:1.15}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;line-height:1.2}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.06)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--off-soft);color:var(--muted);white-space:nowrap}
.chip.peak{background:var(--peak);color:var(--peak-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--accent-soft);color:var(--accent)}
.chip.blue{background:var(--leave);color:var(--leave-ink)}
.bk{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}

/* Year strip */
.strip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{display:grid;grid-template-columns:repeat(17,minmax(34px,1fr));gap:3px;min-width:600px}
.cell{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:4px 2px;text-align:center;font-size:12px;line-height:1.25;min-width:0;position:relative}
.cell .n{font-family:var(--f-display);font-weight:700;font-size:15px;display:block}
.cell .d{color:var(--muted);font-size:10.5px;display:block;white-space:nowrap}
.cell.peak{background:var(--peak)}
.cell.peak .d{color:var(--peak-ink)}
.cell.locked{opacity:.42}
.cell.mine{background:var(--leave);border-color:var(--leave-ink)}
.cell.mine .n,.cell.mine .d{color:var(--leave-ink)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.cell.sel .rank{position:absolute;top:-7px;right:-5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;padding:0 3px}
button.cell{cursor:pointer;font-weight:400;border-radius:5px}
button.cell:disabled{cursor:not-allowed}
.bars{display:grid;grid-template-columns:repeat(17,minmax(34px,1fr));gap:3px;min-width:600px;align-items:end;height:70px;margin-top:6px}
.bars .col{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%}
.bars .b{width:28%;border-radius:2px 2px 0 0;min-height:2px}
.bars .b.s{background:var(--leave-ink)}
.bars .b.d{background:var(--accent)}
.bars .b.p{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Cards */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.bcard .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:grid;gap:8px;min-width:0}
.item.pending{border-left:4px solid var(--warn)}
.item.agreed{border-left:4px solid var(--ok)}
.item.dead{border-left:4px solid var(--off);opacity:.75}
.chain{display:grid;gap:6px}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:6px;background:var(--bg)}
.link.me{background:var(--leave);color:var(--leave-ink)}
.arrow{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.note{border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--leave);color:var(--leave-ink)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

/* Roster table */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.roster{border-collapse:collapse;font-size:12.5px;min-width:900px;width:100%}
table.roster th,table.roster td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:4px 5px;text-align:center;white-space:nowrap}
table.roster th:first-child,table.roster td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px}
table.roster thead th{font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--surface)}
table.roster thead th.peak{background:var(--peak);color:var(--peak-ink)}
table.roster td.on{background:var(--leave);color:var(--leave-ink);font-weight:700}
table.roster td.in{background:var(--ok-soft);color:var(--ok);font-weight:700}
table.roster td.out{color:var(--off);text-decoration:line-through}
table.roster td.listed{box-shadow:inset 0 0 0 2px var(--accent)}
table.roster tfoot td{font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg)}
.lvl{color:var(--muted);font-size:11px;margin-left:4px}
header.top{background:var(--navy);border-bottom:4px solid var(--accent);color:var(--navy-ink)}
header.top .brand small,header.top .actas label{color:#c4d0e6}
header.top nav.tabs a{color:#c4d0e6}
header.top nav.tabs a[aria-current=page]{color:var(--navy-ink);border-bottom-color:var(--accent)}
header.top .brand .mark{background:var(--accent)}
header.top select{border-color:#3b5786}
body::before{background:var(--navy)}
.busy{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px))}
body.isbusy [data-act]{pointer-events:none;opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.how ol,.how ul{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;max-width:72ch}
.how p{max-width:72ch;margin:6px 0 0}
details summary{cursor:pointer;font-weight:600}
@media (max-width:520px){h2{font-size:21px}.bcard .big{font-size:28px}nav.tabs a{padding-inline:10px;font-size:15px}}
@media (prefers-reduced-motion:no-preference){.item,.bcard{transition:border-color .15s}}
</style>

  if (!list.length) { toast('No swaps are waiting for responses.'); return; }
  var hold = {}, w = [], res = { agreed: 0, agreedPeople: 0, failed: 0, decliners: [], released: [], accepted: [] };
  list.forEach(function (sw) {
    var pids = sw.members.map(function (m) { return m.pid; });
    var dec = [];
    if (mode === 'decline') dec = [pids[Math.floor(Math.random() * pids.length)]];
    else if (mode === 'mixed' && Math.random() < 0.45) {
      var k = pids.length >= 4 && Math.random() < 0.3 ? 2 : 1;

  h += '<div class="panel spread"><div><div class="label">Matching round</div><div>' + (last ? 'Last run ' + fmt(new Date(last.ran), true) + ': matched <strong>' + last.people + '</strong> people in ' + last.swaps + ' swaps from ' + last.offers + ' offers.' : 'No rounds run yet.') + '</div><div class="small muted">' + openListings().length + ' open offers in the pool now. Loops of up to ' + MAX_LOOP + ' people. Ties are settled by random draw.</div></div><button class="primary" data-act="round">Run matching round now</button></div>';
  if (DEMO_SIM) {
    var np = all.filter(function (sw) { return swapState(sw) === 'pending'; }).length;
    h += '<div class="panel" style="border-color:var(--navy)"><div class="spread"><div><div class="label">Demo: simulate responses</div><div class="small muted">Answers for everyone in the ' + np + ' swap' + (np === 1 ? '' : 's') + ' waiting for acceptance. When someone declines, the others go straight back into the pool. Decliners are taken out and must offer their block again themselves.</div></div></div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" data-act="simmixed"' + (np ? '' : ' disabled') + '>Some accept, some decline</button><button data-act="simallall"' + (np ? '' : ' disabled') + '>Everyone accepts</button>' +
      '<label class="small row" style="gap:6px"><input type="checkbox" id="rematch"' + (S.rematch ? ' checked' : '') + '> Re-match people sent back to the pool straight away</label></div>';
    var r = S.sim;
    if (r) {
      h += '<div class="note ' + (r.failed ? 'info' : 'ok') + '" style="margin-top:12px"><strong>' + r.agreed + ' swap' + (r.agreed === 1 ? '' : 's') + ' agreed</strong> (' + r.agreedPeople + ' people). <strong>' + r.failed + ' failed</strong>' + (r.failed ? ': ' + r.decliners.length + ' declined and left the pool, ' + r.released.length + ' went back into the pool.' : '.') +
        (r.rematched ? ' Re-match: ' + r.rematched.length + ' of the ' + r.released.length + ' got a new swap (' + r.rematchSwaps + ' new swap' + (r.rematchSwaps === 1 ? '' : 's') + ' waiting for acceptance).' : '') + '</div>';
      if (r.decliners.length) h += '<details data-k="simdetail" style="margin-top:8px"><summary class="small">Who declined and who went back</summary><div class="grid2 small" style="margin-top:6px"><div><div class="label">Declined, out of the pool</div>' + r.decliners.map(function (p) { return esc(pName(p)) + ' <span class="muted">' + esc(stName(BYID[p].station)) + '</span>'; }).join('<br>') + '</div><div><div class="label">Back in the pool</div>' + r.released.map(function (p) { return esc(pName(p)) + ' <span class="muted">' + esc(stName(BYID[p].station)) + '</span>' + (r.rematched && r.rematched.indexOf(p) >= 0 ? ' <span class="chip ok">re-matched</span>' : ''); }).join('<br>') + '</div></div></details>';
    }
    h += '</div>';
  }
  var groups = [['pending', 'Waiting for acceptance'], ['agreed', 'Agreed'], ['other', 'Declined, expired or cancelled']];
  groups.forEach(function (g) {
    var items = all.filter(function (sw) { var st = swapState(sw); return g[0] === 'other' ? (st !== 'pending' && st !== 'agreed') : st === g[0]; });
    if (!items.length && g[0] === 'other') return;
    h += '<div class="list"><h3>' + g[1] + ' <span class="muted small">(' + items.length + ')</span></h3>' + (items.length ? items.map(function (sw) { return swapCard(sw); }).join('') : '<div class="empty">None yet.</div>') + '</div>';
  });
  return h + '</div>';
}
function vRoster() {
  var sid = S.rosterStation || (S.me ? BYID[S.me].station : 'paddington');
  var staff = STAFF.filter(function (s) { return s.station === sid; });
  var h = '<div class="view"><div class="spread"><div><h2>' + esc(stName(sid)) + ' 2027</h2><p class="lede">Approved roster with agreed swaps applied. Green is leave swapped in, struck-through is leave swapped out, a red outline is a block offered in the pool.</p></div><div><label class="label" for="rosterSel">Station</label><br><select id="rosterSel">' + STATIONS.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sid ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div></div>';
  h += '<div class="table-scroll"><table class="roster"><thead><tr><th>Name</th>';
  for (var b = 1; b <= NBLOCKS; b++) h += '<th class="' + (PEAK[b] ? 'peak' : '') + '" title="' + blockRange(b) + '">B' + b + '<div class="small muted" style="font-family:var(--f-body);font-weight:400">' + fmt(blockStart(b)) + '</div></th>';
  h += '</tr></thead><tbody>';
  var counts = {}, sector = {};
  STAFF.forEach(function (s) { holds(s.id).forEach(function (x) { sector[x] = (sector[x] || 0) + 1; }); });
  staff.forEach(function (s) {
    var cur = holds(s.id);
    h += '<tr' + (s.id === S.me ? ' style="font-weight:700"' : '') + '><td>' + esc(s.name) + '<span class="lvl">' + esc(s.level) + '</span></td>';
    for (var b2 = 1; b2 <= NBLOCKS; b2++) {
      var on = cur.indexOf(b2) >= 0, was = s.blocks.indexOf(b2) >= 0, cls = [], txt = '';
      if (on) { counts[b2] = (counts[b2] || 0) + 1; cls.push(was ? 'on' : 'in'); txt = 'A'; } else if (was) { cls.push('out'); txt = 'A'; }
      var l = S.listings[listingId(s.id, b2)]; if (on && l && l.status !== 'withdrawn') cls.push('listed');
      h += '<td class="' + cls.join(' ') + '">' + txt + '</td>';
    }
    h += '</tr>';
  });
  h += '</tbody><tfoot><tr><td>On leave at ' + esc(stName(sid)) + '</td>';
  for (b = 1; b <= NBLOCKS; b++) h += '<td>' + (counts[b] || 0) + '</td>';
  h += '</tr><tr><td>Sector total</td>';
  for (b = 1; b <= NBLOCKS; b++) h += '<td>' + (sector[b] || 0) + '</td>';
  h += '</tr></tfoot></table></div></div>';
  return h;
}
function vHow() {
  var t = today(), pretend = ls('lbx-pretend');
  var h = '<div class="view how"><div><h2>How it works</h2><p class="lede">A prototype for swapping whole blocks of annual leave across ' + STATIONS.length + ' stations in the sector. Staff, names and rosters are made up; the block pattern copies the real 2027 roster.</p></div>';
  h += '<div class="grid2"><div class="panel"><h3>The rules built in</h3><ul>' +
    '<li>2027 has 17 blocks of 3 weeks, starting Saturday 16 Jan 2027. Everyone holds two.</li>' +
    '<li>Only whole blocks can be swapped for now. Shorter periods can come later, when leave can be taken in 1-week periods.</li>' +
    '<li>Swaps close 4 months before a block starts. After that the block is locked, and any unfinished swap involving it expires.</li>' +
    '<li>Swaps can cross stations. Every swap is a loop, so the number of people on leave across the sector never changes in any block.</li>' +
    '<li>A swap is only final when every person in the loop accepts. Then each person asks their own manager to approve it, as the award requires.</li></ul></div>';
  h += '<div class="panel"><h3>Getting a block</h3><ol>' +
    '<li><strong>Offer</strong> one of your blocks and pick the blocks you would take, in order.</li>' +
    '<li><strong>Matching round</strong>: the system finds loops of 2 to ' + MAX_LOOP + ' people where everyone gets one of their choices, matching as many people as possible. Ties go to a random draw.</li>' +
    '<li><strong>Direct swap</strong>: between rounds, if someone is offering a block you want and they would take one of yours, you can propose a 1-for-1 swap straight away.</li>' +
    '<li><strong>Accept</strong> within the swap. Decline and you leave the pool; everyone else goes back in.</li></ol></div></div>';
  h += '<div class="panel"><h3>Open questions for the group</h3><ul><li>Should matching rounds run weekly, fortnightly, or on set dates before each cutoff?</li><li>Should someone who got a peak block (school holidays, Christmas) last year lose tiebreaks this year?</li><li>Is there a limit on how many people from one station can be off in the same block, even with sector flexibility?</li><li>Who runs the app and holds the data once it is real?</li></ul></div>';
  h += '<div class="panel"><h3>Demo tools</h3><p class="small muted">For testing only. Changes here affect everyone using this page.</p><div class="grid2" style="margin-top:10px"><div><label class="label" for="pretend">Pretend today is</label><div class="row" style="margin-top:4px"><input type="date" id="pretend" value="' + (pretend || '') + '"><button data-act="clearpretend"' + (pretend ? '' : ' disabled') + '>Use real date</button></div><div class="small muted" style="margin-top:4px">Now using ' + fmt(t, true) + '. Only changes your view.</div></div>' +
    '<div><div class="label">Pool data</div><div class="row" style="margin-top:4px"><button data-act="samples">Add 40 example requests</button>' + (S.confirmReset ? '<button class="primary" data-act="reset">Yes, clear everything</button><button class="ghost" data-act="noreset">Keep</button>' : '<button data-act="askreset">Clear all swaps and offers</button>') + '</div></div></div></div>';
  h += '<p class="small muted">Not legal advice. Award references: clause 32 (annual leave, exchanges need NSW Ambulance approval) and clause 25 (rosters).</p>';
  return h + '</div>';
}

var _rq = false, _down = false, _pending = false;
function render() { if (_rq) return; _rq = true; requestAnimationFrame(function () { _rq = false; if (_down) { _pending = true; return; } paint(); }); }
document.addEventListener('pointerdown', function () { _down = true; }, true);
document.addEventListener('pointerup', function () { _down = false; if (_pending) { _pending = false; setTimeout(render, 0); } }, true);
document.addEventListener('pointercancel', function () { _down = false; if (_pending) { _pending = false; render(); } }, true);
function paint() {
  try { paintInner(); } catch (err) {
    console.error(err);
    document.getElementById('main').innerHTML = '<div class="note">Something went wrong drawing this screen: ' + esc(err && err.message) + '. Try another tab, or reload the page.</div>';
  }
}
function paintInner() {
  if (!S.busy) cleanupDead();
  var v = S.view, main = document.getElementById('main');
  document.querySelectorAll('nav.tabs a').forEach(function (a) { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  var n = myPendingCount(), bd = document.getElementById('myBadge'); bd.hidden = !n; bd.textContent = n;
  var body = v === 'pool' ? vPool() : v === 'swaps' ? vSwaps() : v === 'roster' ? vRoster() : v === 'how' ? vHow() : vMy();
  if (S.setupNeeded) body = '<div class="note" style="margin-bottom:14px"><strong>Not connected to the shared database.</strong> ' + esc(S.setupNeeded) + ' Until then, changes are saved in this browser only.</div>' + body;
  else if (S.live) body = '<div class="note info" style="margin-bottom:14px">Demo with made-up staff. Everyone using this link shares the same data, and anyone can act as anyone.</div>' + body;
  if (body === S._lastBody) return;
  var open = {}; main.querySelectorAll('details[data-k]').forEach(function (d) { if (d.open) open[d.dataset.k] = 1; });
  S._lastBody = body; main.innerHTML = body;
  main.querySelectorAll('details[data-k]').forEach(function (d) { if (open[d.dataset.k]) d.open = true; });
}

/* ---------- identity picker ---------- */
function fillPeople() {
  var st = document.getElementById('asStation').value, ps = document.getElementById('asPerson');
  ps.innerHTML = '<option value="">Choose a paramedic</option>' + STAFF.filter(function (s) { return s.station === st; }).map(function (s) { return '<option value="' + s.id + '"' + (s.id === S.me ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
}
function initPicker() {
  var ss = document.getElementById('asStation');
  ss.innerHTML = STATIONS.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');
  var saved = ls('lbx-me'); if (!saved || !BYID[saved]) saved = 'paddington-01';
  S.me = saved; ss.value = BYID[saved].station; fillPeople();
  ss.addEventListener('change', function () { fillPeople(); });
  document.getElementById('asPerson').addEventListener('change', function (e) { S.me = e.target.value || null; ls('lbx-me', S.me); S.editing = null; render(); });
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var a = t.dataset.act, b = +t.dataset.b, id = t.dataset.id;
  if (a === 'edit') { var l = S.listings[listingId(S.me, b)]; S.editing = b; S.editWants = l ? l.wants.slice() : []; render(); }
  else if (a === 'canceledit') { S.editing = null; S.editWants = []; render(); }
  else if (a === 'pickwant') { var i = S.editWants.indexOf(b); if (i >= 0) S.editWants.splice(i, 1); else S.editWants.push(b); render(); }
  else if (a === 'savelisting') saveListing(b, S.editWants.slice());
  else if (a === 'withdraw') withdraw(b);
  else if (a === 'direct') { if (!S.me) { toast('Choose who you are acting as first.'); return; } proposeDirect(b, id); }
  else if (a === 'accept') accept(id);
  else if (a === 'decline') decline(id);
  else if (a === 'simmixed') simulate('mixed');
  else if (a === 'simallall') simulate('all');
  else if (a === 'simall') simulate('all', id);
  else if (a === 'simdec') simulate('decline', id);
  else if (a === 'round') runRound();
  else if (a === 'poolblock') { S.poolBlock = S.poolBlock === b ? null : b; render(); }
  else if (a === 'samples') loadSamples();
  else if (a === 'askreset') { S.confirmReset = true; render(); }
  else if (a === 'noreset') { S.confirmReset = false; render(); }
  else if (a === 'reset') resetAll();
  else if (a === 'clearpretend') { ls('lbx-pretend', null); render(); }
  else if (a === 'copy') {
    var txt = approvalText(Object.assign({ id: id }, S.swaps[id]));
    try { navigator.clipboard.writeText(txt).then(function () { toast('Copied. Paste it into an email to your manager.'); }, function () { showText(txt); }); } catch (err) { showText(txt); }
  }
});
function showText(txt) { var m = document.getElementById('main'); var ta = document.createElement('textarea'); ta.value = txt; ta.rows = 10; ta.style.cssText = 'width:100%;font:13px var(--f-mono);margin-top:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px'; m.prepend(ta); ta.select(); toast('Select and copy the text above.'); }
document.addEventListener('change', function (e) {
  if (e.target.id === 'rematch') { S.rematch = e.target.checked; }
  if (e.target.id === 'rosterSel') { S.rosterStation = e.target.value; render(); }
  if (e.target.id === 'pretend') { if (e.target.value) ls('lbx-pretend', e.target.value); else ls('lbx-pretend', null); render(); }
});
function route() { var h = (location.hash || '#my').slice(1); S.view = ['my', 'pool', 'swaps', 'roster', 'how'].indexOf(h) >= 0 ? h : 'my'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);

initPicker();
S.db = MemDB();
route();
(function connect() {
  var cfg = window.LBX_CONFIG, why = null;
  if (!window.supabase || !window.supabase.createClient) why = 'The Supabase library did not load. Check your internet connection and reload.';
  else if (!cfg) why = 'config.js did not load. Check it is uploaded to GitHub with exactly that name (not config.js.txt) next to index.html.';
  else if (!cfg.supabaseUrl || /YOUR-/.test(cfg.supabaseUrl)) why = 'config.js still has the placeholder Project URL. Upload your edited config.js to GitHub, wait a minute, then reload.';
  else if (!cfg.supabaseAnonKey || /YOUR-/.test(cfg.supabaseAnonKey)) why = 'config.js still has the placeholder key. Upload your edited config.js to GitHub, wait a minute, then reload.';
  else if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(cfg.supabaseUrl).trim())) why = 'The Project URL in config.js looks wrong. It should look like https://abcdefgh.supabase.co with nothing after .co.';
  if (why) { S.setupNeeded = why; subscribe(); return; }
  var db = SupaDB(window.supabase.createClient(String(cfg.supabaseUrl).trim().replace(/\/$/, ''), String(cfg.supabaseAnonKey).trim()));
  S.db = db; S.live = true; subscribe();
  db.count().then(function (n) { // first visit to an empty database: load the example requests once
    if (n > 0) return;
    var w = (window.SEED || []).map(function (o) { return function () { return db.doc(o.path).set(o.data); }; });
    w.push(function () { return db.doc('meta/seeded').set({ at: new Date().toISOString() }); });
    return bulk('Loading example requests', w);
  }).catch(function (e) {
    console.error(e);
    var m = (e && e.message) || 'unknown error';
    var hint = /api key|apikey|jwt|401|unauthori/i.test(m) ? ' The key in config.js is probably wrong: use the anon public key that starts with eyJ.' : /relation|does not exist|schema cache|docs/i.test(m) ? ' The docs table is missing: run supabase-setup.sql again in the SQL Editor.' : /fetch|network|failed/i.test(m) ? ' The Project URL may be wrong, or the project is paused: check the Supabase dashboard.' : '';
    S.setupNeeded = 'Supabase refused the connection (' + m + ').' + hint; S.live = false; S.db = MemDB(); subscribe(); render();
  });
})();
