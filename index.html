<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leave Block Exchange</title>
<meta name="description" content="Swap whole blocks of annual leave across stations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='4' fill='%23c8102e'/%3E%3Cpath d='M3 6h9l-2.5-2.5M15 12H6l2.5 2.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script src="config.js"></script>
<script src="js/supabase-db.js"></script>
</head>
<body>
<style>
/* Layout: a roster sheet. A year strip of 17 three-week blocks is the spine of every view. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#0f1f3d; --muted:#5a6680; --line:#d3dbe8; --line-soft:#e8edf5;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe6e9;
  --navy:#0b2a5b; --navy-ink:#ffffff;
  --peak:#fff4c2; --peak-ink:#6b5600; --leave:#dde7f7; --leave-ink:#0b2a5b;
  --ok:#1f7a4d; --ok-soft:#e0f2e8; --warn:#9a5b00; --warn-soft:#fdf0d9; --off:#8691a6; --off-soft:#f1f3f7;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{display:block}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.actas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.actas label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=date]{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--muted);text-decoration:none;padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--f-body);font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 7px}
main{padding-block:20px 48px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.view>*,.panel,.grid2>*,.blocks>*{min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance;line-height:1.15}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;line-height:1.2}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.06)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--off-soft);color:var(--muted);white-space:nowrap}
.chip.peak{background:var(--peak);color:var(--peak-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--accent-soft);color:var(--accent)}
.chip.blue{background:var(--leave);color:var(--leave-ink)}
.bk{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}

/* Year strip */
.strip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{display:grid;grid-template-columns:repeat(17,minmax(34px,1fr));gap:3px;min-width:600px}
.cell{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:4px 2px;text-align:center;font-size:12px;line-height:1.25;min-width:0;position:relative}
.cell .n{font-family:var(--f-display);font-weight:700;font-size:15px;display:block}
.cell .d{color:var(--muted);font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-wrap{min-width:0;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;padding-top:8px}
.strip-wrap .cell{padding:6px 2px}
.bcard.editing{grid-column:1/-1}
.cell.peak{background:var(--peak)}
.cell.peak .d{color:var(--peak-ink)}
.cell.locked{opacity:.42}
.cell.late{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(11,42,91,.10) 5px 9px);border-style:dashed;border-color:var(--leave-ink)}
.legend i.late{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(11,42,91,.35) 3px 5px);border:1px dashed var(--leave-ink)}
.cell.mine{background:var(--leave);border-color:var(--leave-ink)}
.cell.mine .n,.cell.mine .d{color:var(--leave-ink)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.cell.sel .rank{position:absolute;top:-7px;right:-5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;padding:0 3px}
button.cell{cursor:pointer;font-weight:400;border-radius:5px}
button.cell:disabled{cursor:not-allowed}
.bars{display:grid;grid-template-columns:repeat(17,minmax(34px,1fr));gap:3px;min-width:600px;align-items:end;height:70px;margin-top:6px}
.bars .col{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%}
.bars .b{width:28%;border-radius:2px 2px 0 0;min-height:2px}
.bars .b.s{background:var(--leave-ink)}
.bars .b.d{background:var(--accent)}
.bars .b.p{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Cards */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0;align-content:start}
.bcard .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:grid;gap:8px;min-width:0}
.item.pending{border-left:4px solid var(--warn)}
.item.agreed{border-left:4px solid var(--ok)}
.item.dead{border-left:4px solid var(--off);opacity:.75}
.chain{display:grid;gap:6px}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:6px;background:var(--bg)}
.link.me{background:var(--leave);color:var(--leave-ink)}
.arrow{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.note{border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--leave);color:var(--leave-ink)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

.swapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px;align-items:start}
.item.sc{padding:8px 10px;gap:3px;font-size:13px}
.item.sc.mineitem{box-shadow:0 0 0 2px var(--leave-ink)}
.sch{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--f-display);font-size:16px}
.sch .chip{font-family:var(--f-body);font-size:11px;padding:1px 7px}
.scr{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;align-items:baseline;line-height:1.35;padding:1px 4px;border-radius:4px}
.scr.me{background:var(--leave);color:var(--leave-ink)}
.scr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .bb{font-size:12px}
.item.sc button{font-size:13px;padding:4px 10px}
.swapcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.swapsview{gap:12px}
.swapsview .item{padding:10px;gap:6px}
.swapsview .chain{gap:4px}
.swapsview .link{padding:4px 8px;font-size:13.5px}
.swapsview .swapcols .list .item{margin:0}
.swapsview a{color:var(--navy);font-weight:600;font-size:13px}
/* Roster table */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.roster{border-collapse:collapse;font-size:12.5px;min-width:900px;width:100%}
table.roster th,table.roster td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:4px 5px;text-align:center;white-space:nowrap}
table.roster th:first-child,table.roster td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px}
table.roster thead th{font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--surface)}
table.roster thead th.peak{background:var(--peak);color:var(--peak-ink)}
table.roster td.on{background:var(--leave);color:var(--leave-ink);font-weight:700}
table.roster td.in{background:var(--ok-soft);color:var(--ok);font-weight:700}
table.roster td.out{color:var(--off);text-decoration:line-through}
table.roster td.listed{box-shadow:inset 0 0 0 2px var(--accent)}
table.roster tfoot td{font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg)}
.lvl{color:var(--muted);font-size:11px;margin-left:4px}
header.top{background:var(--navy);border-bottom:4px solid var(--accent);color:var(--navy-ink)}
header.top .brand small,header.top .actas label{color:#c4d0e6}
header.top nav.tabs a{color:#c4d0e6}
header.top nav.tabs a[aria-current=page]{color:var(--navy-ink);border-bottom-color:var(--accent)}
header.top .brand .mark{background:var(--accent)}
header.top select{border-color:#3b5786}
body::before{background:var(--navy)}
.busy{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px))}
body.isbusy [data-act]{pointer-events:none;opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.how ol,.how ul{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;max-width:72ch}
.how p{max-width:72ch;margin:6px 0 0}
details summary{cursor:pointer;font-weight:600}
@media (max-width:520px){h2{font-size:21px}.bcard .big{font-size:28px}nav.tabs a{padding-inline:10px;font-size:15px}}
@media (prefers-reduced-motion:no-preference){.item,.bcard{transition:border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 6h9l-2.5-2.5M15 12H6l2.5 2.5" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><h1>Leave Block Exchange</h1><small>Sydney sector · 2027 annual leave</small></div>

    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden role="status"></div>
<div class="busy" id="busy" hidden role="status" aria-live="polite"></div>

<script>
/* ---- Shared data generator (made-up staff, deterministic) ---- */
var NBLOCKS = 17;
var CUTOFF_DAYS = 70; // 10-week cutoff; the final round is 8 days before it, then same-station direct swaps only
var YEAR_START = [2027, 0, 16]; // Saturday 16 Jan 2027
var PEAK = { 1: 'Summer holidays', 5: 'Easter holidays', 9: 'July holidays', 13: 'Spring holidays', 17: 'Christmas' };
var STATIONS = [
  { id: 'bondi', name: 'Bondi', n: 30 },
  { id: 'randwick', name: 'Randwick', n: 32 },
  { id: 'sac', name: 'SAC', n: 40 },
  { id: 'maroubra', name: 'Maroubra', n: 28 },
  { id: 'mascot', name: 'Mascot', n: 31 },
  { id: 'central', name: 'Central', n: 38 },
  { id: 'paddington', name: 'Paddington', n: 35 },
  { id: 'binchicken', name: 'Bin Chicken Bay', n: 26 },
  { id: 'snaghill', name: 'Snag Hill', n: 27 },
  { id: 'wobbly', name: 'Wobbly Gully', n: 29 }
];
var FIRST = ['Ava','Liam','Mia','Noah','Zoe','Jack','Ruby','Oscar','Ella','Leo','Chloe','Hamish','Isla','Tom','Grace','Ned','Maya','Kai','Lucy','Finn','Priya','Raj','Mei','Tariq','Sofia','Luca','Hannah','Ben','Jess','Sam','Aisha','Dan','Nina','Josh','Kate','Will','Ana','Omar','Tess','Ari','Bree','Cal','Dee','Eli','Fern','Gus','Hugo','Ivy'];
var LAST = ['Abbott','Barker','Chen','Dawson','Ellis','Fong','Gallagher','Hughes','Ibrahim','Jensen','Kowalski','Lam','Murphy','Nguyen','OConnell','Patel','Quinn','Rossi','Singh','Tran','Usman','Vella','Walsh','Xu','Young','Zammit','Brennan','Costa','Doyle','Evans','Fraser','Grant','Hale','Ivers','Kerr','Lowe','Mason','Nash','Ortiz','Pike'];

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

function buildStaff() {
  var rnd = mulberry32(2027), staff = [], used = {};
  STATIONS.forEach(function (st, si) {
    var n = st.n, total = 2 * n, base = Math.floor(total / NBLOCKS), extra = total % NBLOCKS, slots = [];
    for (var b = 1; b <= NBLOCKS; b++) {
      var c = base + (((b - 1 + si * 5) % NBLOCKS) < extra ? 1 : 0);
      for (var k = 0; k < c; k++) slots.push(b);
    }
    slots.sort(function (x, y) { return x - y; });
    var pairs = [];
    for (var i = 0; i < n; i++) pairs.push([slots[i], slots[i + n]]);
    shuffle(pairs, rnd);
    for (var p = 0; p < n; p++) {
      var name;
      do { name = FIRST[Math.floor(rnd() * FIRST.length)] + ' ' + LAST[Math.floor(rnd() * LAST.length)].replace('OConnell', "O'Connell"); } while (used[name]);
      used[name] = 1;
      var r = rnd();
      var level = p === 0 ? 'Station Officer' : r < 0.07 ? 'ECP' : r < 0.22 ? 'ICP' : 'Paramedic';
      var clin = p === 0 ? (r < 0.4 ? 'ICP' : 'Paramedic') : level; // Station Officers also hold a clinical level
      staff.push({ id: st.id + '-' + String(p + 1).padStart(2, '0'), name: name, station: st.id, level: level, clin: clin, blocks: pairs[p].slice().sort(function (x, y) { return x - y; }) });
    }
  });
  staff.sort(function (a, b) { return a.station === b.station ? a.name.localeCompare(b.name) : 0; });
  return staff;
}

/* Swap groups: people can only swap with others at the same clinical level.
   Station Officer rank is ignored: an SO swaps as an ICP if they are one, otherwise as a P1. */
function swapGroup(s) { var c = s.clin || s.level; return c === 'ICP' ? 'ICP' : c === 'ECP' ? 'ECP' : 'P1'; }
function levelLabel(s) { return s.level === 'Station Officer' ? 'Station Officer (' + swapGroup(s) + ')' : s.level === 'Paramedic' ? 'Paramedic (P1)' : s.level; }
function blockStart(b) { return new Date(YEAR_START[0], YEAR_START[1], YEAR_START[2] + 21 * (b - 1)); }
function blockEnd(b) { return new Date(YEAR_START[0], YEAR_START[1], YEAR_START[2] + 21 * (b - 1) + 20); }
function blockCutoff(b) { var s = blockStart(b); return new Date(s.getFullYear(), s.getMonth(), s.getDate() - CUTOFF_DAYS); }
function blockOpen(b, today) { return today.getTime() <= blockCutoff(b).getTime(); }

/* Example pool requests: a few guaranteed 2-way and 3-way loops plus random requests. */
function buildSampleListings(staff, today, seed, opts) {
  opts = opts || {}; var N3 = opts.loops3 == null ? 3 : opts.loops3, N2 = opts.loops2 == null ? 3 : opts.loops2, NR = opts.random == null ? 26 : opts.random, usable = opts.usable || function (b) { return blockOpen(b, today); };
  var rnd = mulberry32(seed || 77), out = [], taken = {};
  var openBlocks = []; for (var b = 1; b <= NBLOCKS; b++) if (usable(b)) openBlocks.push(b);
  var pool = shuffle(staff.slice(), rnd);
  function pick(cond) { for (var i = 0; i < pool.length; i++) { var s = pool[i]; if (!taken[s.id] && cond(s)) { taken[s.id] = 1; return s; } } return null; }
  function add(s, block, wants) { out.push({ pid: s.id, station: s.station, block: block, wants: wants, status: 'open', example: true, created: new Date(today.getTime() - Math.floor(rnd() * 9) * 86400000).toISOString() }); }
  function ownOpen(s) { return s.blocks.filter(function (x) { return openBlocks.indexOf(x) >= 0; }); }
  function randOther(s, k, avoid) {
    var c = shuffle(openBlocks.filter(function (x) { return s.blocks.indexOf(x) < 0 && (avoid || []).indexOf(x) < 0; }), rnd);
    c.sort(function (x, y) { return (PEAK[y] ? 1 : 0) - (PEAK[x] ? 1 : 0) + (rnd() - 0.5); });
    return c.slice(0, k);
  }
  // 3-way loops: A gives a wants b, B gives b wants c, C gives c wants a

function lastRound() { var r = Object.keys(S.rounds).map(function (k) { return S.rounds[k]; }).filter(function (x) { return x.kind !== 'rematch'; }).sort(function (a, b) { return (b.ran || '').localeCompare(a.ran || ''); }); return r[0]; }
function vSwaps() {

function vRounds() {

      '<div class="row" style="margin-top:10px"><button class="primary" data-act="simmixed"' + (np ? '' : ' disabled') + '>Some accept, some decline</button><button data-act="simallall"' + (np ? '' : ' disabled') + '>Everyone accepts</button><button data-act="samples5">Add 5 example requests</button>' +
      '<label class="small row" style="gap:6px"><input type="checkbox" id="rematch"' + (S.rematch ? ' checked' : '') + '> Re-match people sent back to the pool straight away</label></div>';

        (r.rematched ? ' Re-match: ' + r.rematched.length + ' of the ' + r.released.length + ' got a new swap (' + r.rematchSwaps + ' new swap' + (r.rematchSwaps === 1 ? '' : 's') + ' waiting for acceptance).' : '') + '</div>';
      if (r.decliners.length) h += '<details data-k="simdetail" style="margin-top:8px"><summary class="small">Who declined and who went back</summary><div class="grid2 small" style="margin-top:6px"><div><div class="label">Declined, out of the pool</div>' + r.decliners.map(function (p) { return esc(pName(p)) + ' <span class="muted">' + esc(stName(BYID[p].station)) + '</span>'; }).join('<br>') + '</div><div><div class="label">Back in the pool</div>' + r.released.map(function (p) { return esc(pName(p)) + ' <span class="muted">' + esc(stName(BYID[p].station)) + '</span>' + (r.rematched && r.rematched.indexOf(p) >= 0 ? ' <span class="chip ok">re-matched</span>' : ''); }).join('<br>') + '</div></div></details>';

function vRoster() {

var _rq = false, _down = false, _pending = false;

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
